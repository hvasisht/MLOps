<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wine Classifier 🍷</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #6b0f1a, #b91c1c);
      padding: 30px 40px;
      text-align: center;
    }
    header h1 { font-size: 2.2rem; letter-spacing: 2px; }
    header p  { opacity: 0.8; margin-top: 6px; }

    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 1.1rem; color: #e2795a; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 9px 12px;
      background: #111; border: 1px solid #333; border-radius: 8px;
      color: #fff; font-size: 0.95rem;
    }
    .field input:focus { outline: none; border-color: #b91c1c; }

    .btn {
      display: inline-block; padding: 12px 32px;
      background: linear-gradient(135deg, #6b0f1a, #b91c1c);
      color: white; border: none; border-radius: 8px;
      font-size: 1rem; cursor: pointer; margin-top: 20px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }

    .result {
      margin-top: 20px; padding: 20px;
      background: #111; border-radius: 10px;
      border-left: 4px solid #b91c1c;
      display: none;
    }
    .result .class-name { font-size: 1.5rem; font-weight: bold; color: #e2795a; }
    .result .sub { font-size: 0.85rem; color: #aaa; margin-top: 4px; }

    .prob-bar { margin-top: 16px; }
    .prob-row { margin-bottom: 10px; }
    .prob-label { font-size: 0.8rem; color: #ccc; margin-bottom: 3px; display: flex; justify-content: space-between; }
    .bar-bg { background: #2a2a2a; border-radius: 99px; height: 10px; }
    .bar-fill { height: 10px; border-radius: 99px; background: linear-gradient(90deg, #6b0f1a, #e2795a); transition: width 0.5s ease; }

    .error { color: #f87171; margin-top: 12px; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>

<header>
  <h1>🍷 Wine Quality Classifier</h1>
  <p>Enter the chemical properties of a wine sample to predict its class</p>
</header>

<div class="container">
  <div class="card">
    <h2>Wine Features</h2>
    <div class="grid" id="featureGrid"></div>
    <button class="btn" onclick="predict()">Predict Wine Class</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="card result" id="resultCard">
    <h2>Prediction Result</h2>
    <div class="class-name" id="className"></div>
    <div class="sub" id="classIndex"></div>
    <div class="prob-bar" id="probBars"></div>
  </div>
</div>

<script>
  const FEATURES = [
    { key: "alcohol",              label: "Alcohol",               example: 13.2  },
    { key: "malic_acid",           label: "Malic Acid",            example: 1.78  },
    { key: "ash",                  label: "Ash",                   example: 2.14  },
    { key: "alcalinity_of_ash",    label: "Alcalinity of Ash",     example: 11.2  },
    { key: "magnesium",            label: "Magnesium",             example: 100.0 },
    { key: "total_phenols",        label: "Total Phenols",         example: 2.65  },
    { key: "flavanoids",           label: "Flavanoids",            example: 2.76  },
    { key: "nonflavanoid_phenols", label: "Nonflavanoid Phenols",  example: 0.26  },
    { key: "proanthocyanins",      label: "Proanthocyanins",       example: 1.28  },
    { key: "color_intensity",      label: "Color Intensity",       example: 4.38  },
    { key: "hue",                  label: "Hue",                   example: 1.05  },
    { key: "od280_od315",          label: "OD280/OD315",           example: 3.40  },
    { key: "proline",              label: "Proline",               example: 1050.0},
  ];

  // Build input fields
  const grid = document.getElementById("featureGrid");
  FEATURES.forEach(f => {
    grid.innerHTML += `
      <div class="field">
        <label>${f.label}</label>
        <input type="number" id="${f.key}" value="${f.example}" step="any"/>
      </div>`;
  });

  async function predict() {
    const body = {};
    FEATURES.forEach(f => body[f.key] = parseFloat(document.getElementById(f.key).value));

    const errorEl  = document.getElementById("errorMsg");
    const resultEl = document.getElementById("resultCard");
    errorEl.style.display = "none";

    try {
      const res  = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Prediction failed");

      document.getElementById("className").textContent  = `🍷 ${data.class_name}`;
      document.getElementById("classIndex").textContent = `Predicted class index: ${data.predicted_class}`;

      const bars = document.getElementById("probBars");
      bars.innerHTML = "";
      Object.entries(data.probabilities).forEach(([cls, prob]) => {
        bars.innerHTML += `
          <div class="prob-row">
            <div class="prob-label"><span>${cls}</span><span>${(prob*100).toFixed(1)}%</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${prob*100}%"></div></div>
          </div>`;
      });

      resultEl.style.display = "block";
    } catch(e) {
      errorEl.textContent = "Error: " + e.message;
      errorEl.style.display = "block";
    }
  }
</script>
</body>
</html>
